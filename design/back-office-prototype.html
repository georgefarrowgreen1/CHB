<title>Blakeney Back Office</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   Tokens — the app's own, lifted from app.css :root (dark) and
   body.light-mode (light). Bare :root carries the COMPLETE light
   palette; the two dark blocks redefine only tokens, so nothing
   depends on a colour that lives inside a media query.
   ============================================================ */
:root{
  --ground:#f5f1e9; --glass:rgba(255,255,255,0.78); --glass-2:rgba(255,255,255,0.92);
  --line:rgba(28,46,58,0.12); --hair:rgba(28,46,58,0.08); --sunk:rgba(28,46,58,0.05);
  --ink:#1b2a34; --muted:#52646e;
  --accent:#c6885e; --accent-text:#965c35; --accent-ink:#1b1208;
  --ok:#4caf50; --ok-text:#29712d; --warn:#ffa726; --warn-text:#9c5300;
  --danger:#e57373; --danger-text:#bc2626; --info:#3884c5; --info-text:#316784;
  --p-21a:#42a5f5; --p-jolly:#43a047; --p-pimp:#9c27b0;
  --shadow:0 6px 18px rgba(30,54,72,0.06); --shadow-lift:0 12px 34px rgba(30,54,72,0.16);
  --r-sm:12px; --r-md:16px; --r-lg:22px;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121316; --glass:rgba(255,255,255,0.038); --glass-2:rgba(255,255,255,0.07);
    --line:rgba(255,255,255,0.08); --hair:rgba(255,255,255,0.055); --sunk:rgba(255,255,255,0.04);
    --ink:#f4f5f7; --muted:#b4b8c6;
    --accent:#d6a785; --accent-text:#d6a785; --accent-ink:#1b1208;
    --ok-text:#81c784; --warn-text:#ffb74d; --danger-text:#ef9a9a; --info-text:#8bbfe4;
    --shadow:0 6px 18px rgba(0,0,0,0.4); --shadow-lift:0 14px 40px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  --ground:#121316; --glass:rgba(255,255,255,0.038); --glass-2:rgba(255,255,255,0.07);
  --line:rgba(255,255,255,0.08); --hair:rgba(255,255,255,0.055); --sunk:rgba(255,255,255,0.04);
  --ink:#f4f5f7; --muted:#b4b8c6;
  --accent:#d6a785; --accent-text:#d6a785; --accent-ink:#1b1208;
  --ok-text:#81c784; --warn-text:#ffb74d; --danger-text:#ef9a9a; --info-text:#8bbfe4;
  --shadow:0 6px 18px rgba(0,0,0,0.4); --shadow-lift:0 14px 40px rgba(0,0,0,0.6);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}

/* ---- shell ---- */
.shell{display:flex;height:100%;}
.rail{width:220px;flex:0 0 220px;background:var(--glass);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 14px 16px;transition:width .18s ease,flex-basis .18s ease;}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;}
.bname{font-family:var(--serif);font-size:0.98rem;font-weight:600;line-height:1.15;white-space:nowrap;}
.bsub{font-size:0.62rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted);margin-top:3px;}
.navs{display:flex;flex-direction:column;gap:2px;}
.nav{display:flex;align-items:center;gap:11px;padding:10px;border-radius:var(--r-sm);
  font-size:0.87rem;font-weight:500;text-align:left;width:100%;min-height:44px;position:relative;}
.nav svg{flex:0 0 auto;color:var(--muted);}
.nav:hover{background:var(--glass-2);}
.nav[aria-current="page"]{background:var(--glass-2);font-weight:600;box-shadow:var(--shadow);}
.nav[aria-current="page"] svg{color:var(--accent-text);}
.cnt{margin-left:auto;font-size:0.72rem;font-weight:600;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.cnt.hot{color:var(--danger-text);}
.spacer{flex:1 1 auto;}
.ask{display:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--glass);color:var(--muted);font-size:0.82rem;
  text-align:left;min-height:44px;}
.ask:hover{background:var(--glass-2);}
.kbd{margin-left:auto;font-size:0.66rem;border:1px solid var(--hair);border-radius:5px;padding:1px 5px;}
.themeb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;
  padding:9px;border-radius:999px;font-size:0.74rem;color:var(--muted);min-height:38px;}
.themeb:hover{background:var(--glass-2);}

/* ---- spine ---- */
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;}
.spine{padding:20px 30px 16px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--ground) 88%,var(--ink));
  flex:0 0 auto;position:sticky;top:0;z-index:5;transition:padding .18s ease;
  backdrop-filter:blur(10px);}
.daysent{font-family:var(--serif);font-size:1.34rem;font-weight:600;line-height:1.28;
  text-wrap:balance;margin:0;}
.dayops{font-size:0.85rem;color:var(--muted);margin-top:5px;}
.duties{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px;}
.duty{display:inline-flex;align-items:center;gap:7px;font-size:0.78rem;font-weight:600;
  padding:7px 13px 7px 11px;border-radius:999px;min-height:34px;}
.duty:hover{filter:brightness(1.06);}
.duty.bad{color:var(--danger-text);background:color-mix(in srgb,var(--danger) 13%,transparent);border:1px solid color-mix(in srgb,var(--danger) 24%,transparent);}
.duty.warn{color:var(--warn-text);background:color-mix(in srgb,var(--warn) 13%,transparent);border:1px solid color-mix(in srgb,var(--warn) 24%,transparent);}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.nav.moreph{display:none;}
.dutymore{display:none;align-items:center;font-size:0.73rem;font-weight:600;padding:7px 12px;border-radius:999px;color:var(--muted);background:color-mix(in srgb,var(--muted) 9%,transparent);border:1px solid color-mix(in srgb,var(--muted) 17%,transparent);min-height:34px;}
.spine.cond{padding:11px 30px;display:flex;align-items:center;gap:14px;}
.spine.cond .daysent{font-size:0.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;}
.spine.cond .dayops,.spine.cond .duties{display:none;}
.condn{display:none;font-size:0.72rem;font-weight:700;padding:4px 10px;border-radius:999px;
  color:var(--danger-text);background:color-mix(in srgb,var(--danger) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--danger) 26%,transparent);flex:0 0 auto;}
.spine.cond .condn{display:inline-flex;}

/* ---- body + pane ---- */
.work{flex:1 1 auto;display:flex;gap:22px;padding:24px 30px 30px;min-height:0;}
.col{flex:1 1 auto;min-width:0;max-width:1080px;}
.col.split{max-width:640px;}
.pane{flex:0 0 380px;align-self:flex-start;background:var(--glass);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;}
.cap{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--muted);margin:0 4px 8px;}
.cap.attn{color:var(--danger-text);}
.cap+.grp{margin-bottom:18px;}
.grp{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  min-height:50px;padding:13px 18px;text-align:left;}
.row+.row{border-top:1px solid var(--hair);}
.row:hover{background:var(--glass-2);}
.row[aria-selected="true"]{background:var(--glass-2);box-shadow:inset 3px 0 0 var(--accent);}
.lbl{font-weight:600;font-size:0.95rem;min-width:0;}
.sub{display:block;font-weight:400;font-size:0.78rem;color:var(--muted);margin-top:2px;}
.right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.money{font-family:var(--serif);font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums;}
.chev{color:var(--muted);}
.stc{display:inline-flex;align-items:center;gap:6px;font-size:0.76rem;font-weight:600;
  padding:4px 11px;border-radius:999px;white-space:nowrap;}
.stc.ok{color:var(--ok-text);background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid color-mix(in srgb,var(--ok) 24%,transparent);}
.stc.warn{color:var(--warn-text);background:color-mix(in srgb,var(--warn) 13%,transparent);border:1px solid color-mix(in srgb,var(--warn) 24%,transparent);}
.stc.bad{color:var(--danger-text);background:color-mix(in srgb,var(--danger) 13%,transparent);border:1px solid color-mix(in srgb,var(--danger) 24%,transparent);}
.stc.unk{color:var(--muted);background:color-mix(in srgb,var(--muted) 10%,transparent);border:1px solid color-mix(in srgb,var(--muted) 18%,transparent);font-weight:500;}
.pulse{font-size:0.88rem;color:var(--muted);margin:0 4px 14px;line-height:1.55;}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--sunk);border-radius:999px;margin-bottom:14px;}
.segb{font-size:0.78rem;font-weight:600;padding:8px 15px;border-radius:999px;color:var(--muted);min-height:38px;}
.segb[aria-pressed="true"]{background:var(--glass-2);color:var(--ink);box-shadow:var(--shadow);}

/* ---- pane innards ---- */
.phd{padding:16px 18px 14px;border-bottom:1px solid var(--hair);}
.pid{font-family:var(--serif);font-size:1.15rem;font-weight:600;}
.pwhen{font-size:0.78rem;color:var(--muted);margin-top:4px;line-height:1.5;}
.next{margin:14px 18px 2px;border-radius:var(--r-md);padding:13px 15px;
  background:color-mix(in srgb,var(--warn) 11%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 22%,transparent);}
.next.go{background:color-mix(in srgb,var(--ok) 11%,transparent);border-color:color-mix(in srgb,var(--ok) 22%,transparent);}
.nstep{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--warn-text);}
.next.go .nstep{color:var(--ok-text);}
.nsay{font-size:0.9rem;font-weight:600;margin-top:5px;}
.nsub{font-size:0.78rem;color:var(--muted);margin-top:4px;}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;font-size:0.82rem;}
.kv+.kv{border-top:1px solid var(--hair);}
.kvk{color:var(--muted);}
.kvv{font-weight:600;text-align:right;}
.pacts{display:flex;flex-wrap:wrap;gap:8px;padding:13px 18px;border-top:1px solid var(--hair);}
.btn{font-size:0.8rem;font-weight:600;padding:10px 16px;border-radius:999px;min-height:40px;
  border:1px solid var(--line);background:var(--glass);}
.btn:hover{background:var(--glass-2);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.pri:hover{filter:brightness(1.06);background:var(--accent);}
.quote{font-size:0.84rem;line-height:1.6;padding:0 18px 4px;}
.backlink{display:none;align-items:center;gap:6px;font-size:0.82rem;font-weight:600;
  color:var(--accent-text);margin:0 0 14px;min-height:40px;}

/* ---- lanes ---- */
.lanes{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px 16px 16px;box-shadow:var(--shadow);}
.lhd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;}
.lmo{font-family:var(--serif);font-size:0.95rem;font-weight:600;}
.lane{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.llbl{width:96px;flex:0 0 auto;font-size:0.74rem;font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:6px;}
.track{flex:1 1 auto;height:26px;border-radius:7px;background:var(--sunk);position:relative;overflow:hidden;}
.bar{position:absolute;top:3px;height:20px;border-radius:5px;display:flex;align-items:center;
  padding:0 8px;font-size:0.68rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;}
.bar.ext{background:color-mix(in srgb,var(--muted) 26%,transparent);color:var(--ink);}
.days{display:flex;margin-left:105px;margin-top:2px;}
.lanescroll{overflow-x:auto;overflow-y:hidden;}
.lanescroll>*{min-width:520px;}
.dnum{flex:1 1 0;font-size:0.6rem;color:var(--muted);text-align:center;}

/* ---- ask overlay ---- */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,0.42);backdrop-filter:blur(2px);
  display:none;z-index:40;}
.scrim.open{display:block;}
.askwrap{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);
  z-index:41;display:none;}
.askwrap.open{display:block;}
.askbox{background:var(--ground);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lift);overflow:hidden;}
.askfield{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--hair);}
.askfield input{flex:1 1 auto;background:none;border:none;color:var(--ink);font-family:var(--sans);
  font-size:1rem;outline:none;min-width:0;}
.askfield input::placeholder{color:var(--muted);}
.asklist{max-height:52vh;overflow-y:auto;padding:8px;}
.askrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:11px 12px;border-radius:var(--r-md);text-align:left;min-height:44px;}
.askrow:hover,.askrow.on{background:var(--glass-2);}
.asknone{padding:22px 14px;text-align:center;color:var(--muted);font-size:0.88rem;}
.askfoot{padding:10px 18px;border-top:1px solid var(--hair);font-size:0.72rem;color:var(--muted);}

/* ---- phone dock ---- */
.dock{display:none;}

/* ============================================================
   The app's own breakpoints. Resizing this window walks the
   whole story: rail folds at 1200, pane goes at 1120, the rail
   becomes a bottom dock at 760.
   ============================================================ */
@media (max-width:1199px){
  .rail{width:64px;flex-basis:64px;padding:20px 9px 14px;align-items:center;}
  .brand div,.nav span:not(.cnt),.ask span:not(.kbd),.kbd,.themeb span{display:none;}
  .brand{padding:0 0 18px;justify-content:center;}
  .navs{width:100%;}
  .nav{justify-content:center;padding:11px 0;}
  .cnt{position:absolute;top:6px;right:11px;margin:0;width:7px;height:7px;border-radius:50%;
    background:var(--muted);font-size:0;color:transparent;overflow:hidden;}
  .cnt.hot{background:var(--danger);}
  .ask{justify-content:center;padding:11px 0;}
  .themeb{padding:9px 0;}
}
@media (max-width:1119px){
  .pane{display:none;}
  .col.split{max-width:1080px;}
  body.record .col{display:none;}
  body.record .pane{display:block;flex:1 1 auto;max-width:640px;align-self:stretch;}
  body.record .backlink{display:inline-flex;}
}
@media (max-width:759px){
  .shell{flex-direction:column;}
  .rail{width:100%;flex:0 0 auto;flex-basis:auto;flex-direction:row;order:2;
    border-right:none;border-top:1px solid var(--line);padding:9px 6px calc(9px + env(safe-area-inset-bottom));
    justify-content:space-around;}
  .brand,.spacer,.themeb{display:none;}
  .navs{flex-direction:row;justify-content:space-around;width:100%;gap:0;}
  .nav{flex-direction:column;gap:4px;font-size:0.6rem;padding:7px 4px;min-height:52px;}
  .nav span:not(.cnt){display:block;}
  .nav[aria-current="page"]{background:none;box-shadow:none;color:var(--accent-text);}
  .nav[aria-current="page"] svg{color:var(--accent-text);}
  .cnt{top:3px;right:calc(50% - 16px);}
  .nav.hideph{display:none;}
  .nav.moreph{display:flex;}
  .ask{display:none;}
  .main{order:1;min-height:0;}
  .spine{padding:16px 16px 13px;}
  .daysent{font-size:1.06rem;}
  .work{padding:16px 16px 22px;}
  .duty{font-size:0.73rem;}
  .duty.overflow{display:none;}
  .dutymore{display:inline-flex;}
  .askwrap{top:0;left:0;transform:none;width:100%;height:100%;}
  .askbox{height:100%;border-radius:0;border:none;display:flex;flex-direction:column;}
  .asklist{max-height:none;flex:1 1 auto;}
}
</style>

<div class="shell">

      <span>Theme</span>

  <div class="main" id="main">

<div class="scrim" id="scrim"></div>

    </div>
    <div class="asklist" id="asklist"></div>
    <div class="askfoot">Sample data — this is a prototype of the layout, not your live account.</div>
  </div>
</div>

<script>

/* ---- toast ---- */
let toastT;
function toast(msg){
  let t = $('#toast');
  if (!t){ t = document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;'
      +'background:var(--ink);color:var(--ground);padding:12px 20px;border-radius:999px;'
      +'font-size:0.85rem;font-weight:600;box-shadow:var(--shadow-lift);max-width:90vw;text-align:center;';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; }, 2200);
}

/* ---- events ---- */
document.addEventListener('click', (ev) => {
  const el = ev.target instanceof Element ? ev.target.closest('[data-go],[data-rec],[data-back],[data-folder],[data-duty],[data-answer],[data-toast],[data-ask]') : null;
  if (!el) return;
  if (el.dataset.go)     { state.view = el.dataset.go; state.sel = null; render(); $('#main').scrollTop = 0; }
  else if (el.dataset.rec)   { state.sel = el.dataset.rec; render(); }
  else if (el.dataset.back)  { state.sel = null; render(); }
  else if (el.dataset.folder){ state.folder = el.dataset.folder; state.sel = null; render(); }
  else if (el.dataset.duty !== undefined){
    const d = DUTIES[+el.dataset.duty];
    state.view = d.go[0]; state.sel = d.go[1]; render(); $('#main').scrollTop = 0; askOpen(false);
  }
  else if (el.dataset.answer !== undefined){
    const a = ANSWERS[+el.dataset.answer];
    state.view = a.go[0]; state.sel = a.go[1]; render(); askOpen(false);
  }
  else if (el.dataset.ask)   { askOpen(true); $('#askinput').value = el.dataset.ask; askRender(); }
  else if (el.dataset.toast) { toast(el.dataset.toast); }
});
$('#askbtn').addEventListener('click', () => askOpen(true));
$('#askclose').addEventListener('click', () => askOpen(false));
$('#scrim').addEventListener('click', () => askOpen(false));
$('#askinput').addEventListener('input', askRender);
$('#themeb').addEventListener('click', () => {
  const now = document.documentElement.getAttribute('data-theme');
  const dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
});
document.addEventListener('keydown', (ev) => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k'){ ev.preventDefault(); askOpen(true); }
  else if (ev.key === 'Escape'){ if ($('#askwrap').classList.contains('open')) askOpen(false); else if (state.sel){ state.sel=null; render(); } }
});
// The spine condenses on scroll — how it earns its room on a small screen.
const phone = () => matchMedia('(max-width:759px)').matches;
// HYSTERESIS, and it is load-bearing. The spine is part of the scrolled
// content, so condensing it shortens scrollHeight by the ~86px it gives back —
// which on a page with less overflow than that clamps scrollTop, fires another
// scroll, and expands it again. Measured oscillating at 1440x620. A dead zone
// wider than the reclaim settles it: a page too short to reach 120px simply
// keeps the full spine, which is the right answer there anyway.
const CONDENSE_AT = 120, EXPAND_AT = 40;
function condense(){
  const s = $('#spine');
  if (phone()){ s.classList.toggle('cond', state.view !== 'today'); return; }
  const top = $('#main').scrollTop;
  if (top > CONDENSE_AT) s.classList.add('cond');
  else if (top < EXPAND_AT) s.classList.remove('cond');
}
$('#main').addEventListener('scroll', condense, {passive:true});
addEventListener('resize', condense);

spine(); render();
</script>
