; PHP settings for this folder and everything under it, read by IONOS's PHP (it runs PHP as
; CGI, which reads .user.ini files; it re-reads this one within 5 minutes of a change).
;
; PHP2Shell (CVE-2026-109619, announced 21/10/2026): PHP's own temporary workaround until the
; host installs the release with the fix. The site never uses session upload progress, so
; switching it off changes nothing anyone sees. Manage -> Status says whether it is in force
; ("PHP workaround") and when PHP has the fix ("PHP version").
session.upload_progress.enabled = 0
