<!-- ============================================================
     admin-views.html — the BACK-OFFICE MARKUP, split out of index.html.

     Every admin screen's body lives here instead of in index.html, because a
     guest downloads index.html and never sees any of it (it was ~40% of the
     file / ~17KB gzipped). index.html keeps the empty <main id="view-..."">
     shells so nav()/ADMIN_VIEWS keep working untouched; app.js's
     ensureAdminViews() injects these bodies into those shells as part of
     loadAdminBundle() — the same on-demand path that already fetches admin.js
     and admin.css when an owner signs in.

     RULES
       - Versioned by ADMIN_BUNDLE_V (app.js), the SAME stamp as admin.js: the
         two must move in lockstep because admin.js's renderers target these
         ids, so one shared version can't drift the way two would.
         bump.js/check-versions.js enforce it.
       - Deliberately NOT in the sw.js CORE precache (same as admin.js) — guests
         must never fetch it.
       - One <template data-view="<view id>"> per admin screen. Keep the ids:
         everything (admin.js, the ui-tests, the layout gate) addresses them.
     ============================================================ -->
<template data-view="view-backoffice">

        <div class="dashboard-header">
            <div>
                <h1 class="section-title" style="margin: 0;">Today</h1>
                <p class="lead bo-today-date" id="today-date" style="text-align:left;margin:4px 0 0;"></p>
            </div>
        </div>

        <!-- ASSIST BAR — the search brain embedded in the workspace: type a
             guest name to live-filter the board below, or ask a question and
             the answer appears inline. Injected by chbAssistBar() (admin.js)
             so guests never download any of it. -->

        <!-- NEEDS YOU — the one prioritised to-do list: everything across the
             back office that's waiting on the owner (automation warnings,
             enquiries, balances to chase, deposits to return, chats,
             approvals), each a one-tap jump to the exact place to act.
             Hidden when all clear — the ops line above already says
             "all quiet". Rendered by renderNeedsYou() (admin.js). -->
        <div id="needs-you" style="display:none;">
            <!-- The heading tells the truth about the CONTENTS: duties "need you";
                 a strip of pure opportunities reads "Worth a look" (set in
                 renderNeedsYou, calmer green badge). -->
            <h2 class="bo-sec-title" style="margin-top:14px;"><span id="needs-you-word">Needs you</span> <span class="inbox-badge" id="needs-you-count">0</span></h2>
            <div id="needs-you-list"></div>
        </div>

        <!-- (The dashboard search moved to the Bookings page; the health /
             needs-a-look pills moved to Settings.) -->

        <!-- (The "Today & this week" panel was removed at the owner's request —
             the calendar + dock pips carry the day's state.) -->

        <!-- CALENDAR (left) + PENDING ENQUIRIES (right) -->
        <div class="bo-layout">
            <!-- CALENDAR -->
            <div>
                <div class="cal-header-bar">
                    <div class="cal-month-nav">
                        <div class="cal-month-title" id="cal-month-display">June 2026</div>
                        <div class="tl-seg" role="group" aria-label="Move along the timeline">
                            <button aria-label="Earlier" data-act="changeMonth" data-arg="-1">&#10094;</button>
                            <button class="tl-today-btn" data-act="timelineToday">Today</button>
                            <button aria-label="Later" data-act="changeMonth" data-arg="1">&#10095;</button>
                            <button aria-label="Compact view — fit more days" title="Compact view — fit more days" aria-pressed="false" data-act="tlToggleZoom"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:14px;height:14px;"><path d="M8 4v16M16 4v16M3 4h18M3 20h18"/></svg></button>
                        </div>
                    </div>
                    <div class="cal-actions">
                        <button class="btn-glass btn-accent cal-add-btn" data-act="openAddBooking" data-edit-text="cal-add-btn">+ Add Booking</button>
                        <button class="btn-glass cal-add-btn" data-act="openBlockDates">Block dates</button>
                        <div class="cal-updated">
                            <span id="cal-updated-text"></span>
                            <button class="cal-refresh-btn" id="cal-refresh-btn" data-act="autoSyncIcalBlocks" data-arg="true" title="Refresh external bookings now" aria-label="Refresh external bookings now"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-1.9 5.3"/><path d="M20 5v6h-6"/></svg></button>
                        </div>
                    </div>
                </div>

                <!-- TIMELINE: one row per cottage, days flowing across — bookings
                     as bars (tap → hub), imported blocks greyed (display-only),
                     free days tappable to start an Add Booking on that date. -->
                <div class="glass-panel cal-panel">
                    <div id="cal-body" class="tl-wrap"><!-- renderCalendar() injects the timeline --></div>
                </div>

                <!-- Guest details now open in a pop-up when a booking is clicked -->
            </div>
        </div>

        <!-- BOOKINGS WORKSPACE — the timeline shows WHEN, these rows show WHO
             and what's owed, and the hub is where you act. ≥1200px this is a
             master–detail: index rows left, the SELECTED booking's hub docked
             right (the shared #booking-hub-content node re-parents into the
             pane). Narrower screens keep the two-step list → hub flow. -->
        <div class="bk-split" id="bookings-workspace">
        <div id="bookings-main">
            <h2 class="bo-sec-title">Bookings</h2>
            <div id="bookings-summary" style="font-size:0.85rem;color:var(--text-muted);margin:2px 0 12px;"></div>
            <!-- Per-page search removed — the back-office ⌘K search covers finding a
                 booking by guest, email or reference. The filters below stay. -->
            <div class="inbox-sort seg" id="bookings-filters" role="tablist" aria-label="Filter bookings">
                <button class="inbox-sort-btn is-on" role="tab" data-act="bookingsSetFilter" data-arg="upcoming" data-bfilter="upcoming">Upcoming</button>
                <button class="inbox-sort-btn" role="tab" data-act="bookingsSetFilter" data-arg="needspay" data-bfilter="needspay">Needs payment</button>
                <button class="inbox-sort-btn" role="tab" data-act="bookingsSetFilter" data-arg="customplan" data-bfilter="customplan">Custom plan</button>
                <button class="inbox-sort-btn" role="tab" data-act="bookingsSetFilter" data-arg="past" data-bfilter="past">Past</button>
                <button class="inbox-sort-btn" role="tab" data-act="bookingsSetFilter" data-arg="all" data-bfilter="all">All</button>
            </div>
            <div id="bookings-list"><!-- JS injects booking rows here --></div>
        </div>
        <aside id="bookings-detail-pane" aria-label="Selected booking">
            <div id="bookings-detail-empty">Select a booking on the left — everything about it (money, emails, guest, history) appears here.</div>
        </aside>
        </div>

        <!-- (The money/arrivals summary cards + occupancy heatmap were removed —
             Money owns the figures, the calendar shows occupancy.) -->

        <!-- The Recent-activity feed moved to Manage → Activity log, so the
             phone dashboard stays a short, do-things page. -->

    </template>

             shared #enquiry-hub-content node re-parents into the pane). -->

             edge); the three-pane split — rail | list | reading pane — sits
             entirely below it. -->

            <span class="back-link" role="button" tabindex="0" data-act-keydown="activate" data-act="navBackoffice">← Back to Today</span>

                 (inboxSubline() keeps it current — what's waiting for a reply). -->

                <div>
                    <h1 class="section-title" style="margin: 0;">Inbox</h1>
                    <p class="lead bo-today-date" id="inbox-subline" style="text-align:left;margin:4px 0 0;">Enquiries, guest chat &amp; email — every conversation in one place.</p>

                 three-pane split): filter every folder at once or ask inline. -->
        </div>

        <div id="inbox-main">
            <!-- (Approvals live in Marketing → "To approve"; the Today card points there.) -->
            <!-- ONE comms dashboard: every conversation channel behind a folder
                 switch — website enquiries, guest chat, and the cottage EMAIL
                 mailbox (moved here from Manage; one home per task). -->

                 verdict fold group per folder — the existing #inbox-folder-* divs

                <section class="bhub-card glass-panel bhub-fold-grp" data-grp="iv-messages">
                    <button type="button" class="bhub-fold-row" data-act="ivToggle" data-arg="messages" aria-expanded="false" aria-controls="iv-fold-messages">
                        <span class="bhub-fold-lbl"><svg class="iv-lic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.6-.8L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg><span class="iv-lwrap"><span id="iv-lbl-messages">Messages</span><small class="bhub-fold-sub" id="iv-sub-messages"></small></span></span>
                        <span class="bhub-fold-right"><span id="iv-sum-messages"></span><span class="bhub-chev" aria-hidden="true">›</span></span>
                    </button>
                    <div class="bhub-fold" id="iv-fold-messages" hidden></div>
                </section>
                <section class="bhub-card glass-panel bhub-fold-grp" data-grp="iv-email">
                    <button type="button" class="bhub-fold-row" data-act="ivToggle" data-arg="email" aria-expanded="false" aria-controls="iv-fold-email">
                        <span class="bhub-fold-lbl"><svg class="iv-lic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 6.5l8 6 8-6"/></svg><span class="iv-lwrap"><span id="iv-lbl-email">Email</span><small class="bhub-fold-sub" id="iv-sub-email"></small></span></span>
                        <span class="bhub-fold-right"><span id="iv-sum-email"></span><span class="bhub-chev" aria-hidden="true">›</span></span>
                    </button>
                    <div class="bhub-fold" id="iv-fold-email" hidden></div>
                </section>
            </div>
            <div class="inbox-sort seg" id="inbox-folders" role="tablist" aria-label="Inbox folders">
                <button class="inbox-sort-btn is-on" role="tab" data-ifolder="enquiries" data-act="inboxFolder" data-arg="enquiries"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Enquiries <span class="ifold-count" id="ifold-count-enq"></span></button>
                <button class="inbox-sort-btn" role="tab" data-ifolder="messages" data-act="inboxFolder" data-arg="messages"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.6-.8L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg>Messages <span class="ifold-count" id="ifold-count-msg"></span></button>
                <button class="inbox-sort-btn" role="tab" data-ifolder="email" data-act="inboxFolder" data-arg="email"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 6.5l8 6 8-6"/></svg>Email <span class="ifold-count" id="ifold-count-mbx"></span></button>
            </div>
            <!-- Enquiries folder -->
            <div id="inbox-folder-enquiries">
            <h2 class="bo-sec-title">Enquiries <span class="inbox-badge" id="inbox-badge">0</span></h2>
            <div id="inbox-list"><!-- JS injects enquiry cards here --></div>
            </div>
            <!-- Messages folder (guest chat + the comms automations) -->
            <div id="inbox-folder-messages" style="display:none;">
            <div class="msg-head-row" style="display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;">
                <h2 class="bo-sec-title" style="margin:0;">Guest messages <span class="inbox-badge zero" id="messages-badge">0</span></h2>
                <!-- Show-archived toggle docks here, to the RIGHT of the heading
                     (renderMessages fills it); frees the controls row below. -->
                <span id="messages-head-actions"></span>
            </div>
            <div id="messages-list"><!-- JS injects message threads here --></div>
            <!-- Comms automation (instant answers, away reply, follow-up emails)
                 lives in Manage → Messages now, not here. -->
            </div>
            <!-- Email folder — the mailbox client (rendered by admin.js) -->
            <div id="inbox-folder-email" style="display:none;">
                <!-- The heading its two sibling folders both have. Outside #mailbox-body
                     because renderMailboxList() replaces that wholesale. -->
                <h2 class="bo-sec-title">Email</h2>
                <div id="mailbox-body"><div class="skel-row" aria-hidden="true"><span class="skel-bar w20"></span><span class="skel-bar w65"></span><span class="skel-bar w45"></span></div><div class="skel-row" aria-hidden="true"><span class="skel-bar w20"></span><span class="skel-bar w45"></span><span class="skel-bar w65"></span></div><div class="skel-row" aria-hidden="true"><span class="skel-bar w20"></span><span class="skel-bar w65"></span><span class="skel-bar w45"></span></div></div>
            </div>
        </div>
        <!-- The pane serves EVERY folder — an enquiry hub, an email, a docked guest chat —
             so it cannot be named for one of them. -->
        <aside id="inbox-detail-pane" aria-label="Selected item">
            <div id="inbox-detail-empty">Select an enquiry on the left — its details and actions appear here.</div>
        </aside>
        </div>
        <!-- Comms automation (instant answers / away reply / follow-up emails)
             moved to Manage → Messages (#sec-chat-answers / #sec-chat-away /
             #sec-follow-ups). -->
    </template>

<template data-view="view-settings">
        <!-- Area-level chrome (back link, title, search, recent) — hidden while a
             drill-down section is open so the section leads with ONE back link
             and its own title, not two stacked headers. -->
        <div id="settings-chrome">
        <span class="back-link" role="button" tabindex="0" data-act-keydown="activate" data-act="navBackoffice">← Back to Today</span>
        <div class="dashboard-header settings-head">
            <div class="settings-head-titles">
                <h1 class="section-title" style="margin: 0;">Manage</h1>
            </div>
            <!-- Both health pills sit to the RIGHT of the Manage title (stacked if
                 both show). #cron-pill = automation quiet (checkCronHealth);
                 #health-pill = systems rollup incl. "N things need a look"
                 (checkSystemHealth). The full-width cron-alert banner stays below. -->
            <div class="settings-head-pills">
                <button id="cron-pill" class="cron-pill" style="display:none;" data-act="settingsOpen" data-arg="diagnostics" title="Open Status"></button>
                <button id="health-pill" class="cron-pill" style="display:none;" data-act="settingsOpen" data-arg="diagnostics" title="Open Status"></button>
            </div>
        </div>

        <!-- Cron dead-man's-switch: shown by checkCronHealth() only when the daily
             automation has gone quiet. -->

        <!-- INDEX — ordered by importance: your cottages first, then money & guests,
             then your listing & account, with the legal reference last.
             Per-page search removed — the back-office ⌘K search finds any setting;
             the grouped index below is the browse path. -->

        <div id="settings-index" class="settings-index">

                 from the SAME stores the pills read (__cronStatusPre, the

            <!-- One Manage index: cottages first (with each cottage's key numbers),
                 then marketing, then account/system — the section labels are the

            <div class="settings-sec" id="sec-cancel" style="display:none;">
                <div id="cancel-list" class="settings-index"></div>
                <div id="cancel-detail" style="display:none;"></div>
            </div>

            <!-- Payments -->
            <div class="settings-sec" id="sec-payments" style="display:none;">
                <div class="accounts-stat" style="max-width:640px;">
                    <div class="label">Card payments status</div>
                    <p id="sq-settings-status" style="font-size:0.9rem;margin:8px 0 4px;">Checking…</p>
                    <div class="acr-row" style="padding-left:0;padding-right:0;">
                        <span class="acr-lbl">Deposit to request<small>of the total, asked on approval</small></span>
                        <span class="acr-step"><button type="button" data-act="occStep" data-args='["sq-deposit-pct","-1","1"]' aria-label="Deposit percent — less">−</button><span class="acr-val"><input type="number" id="sq-deposit-pct" min="1" max="100" step="1" aria-label="Deposit percent"><span class="acr-unit">%</span></span><button type="button" data-act="occStep" data-args='["sq-deposit-pct","1","1"]' aria-label="Deposit percent — more">+</button></span>
                    </div>
                    <div class="acw-acts" style="padding-left:0;border-top:0;"><button class="btn-sm btn-edit" data-act="saveDepositPct">Save</button></div>
                    <details class="help-disclosure">
                        <summary>How payment reminders work</summary>
                        <p style="font-size:0.82rem;color:var(--text-light);margin-top:8px;line-height:1.6;"><strong>Automatic schedule:</strong> when you approve an enquiry the guest is emailed a request for the deposit above. The balance is then auto-requested <strong>30 days before check-in</strong>. If a booking is approved when check-in is already inside 30 days, the guest is asked for the <strong>full amount upfront</strong>.</p>
                        <p style="font-size:0.8rem;color:var(--text-muted);margin-top:10px;">These reminders are sent automatically overnight — you don't need to do anything. You can also send a payment request by hand anytime from a booking's details. (Taking card payments needs a one-time Square setup by whoever looks after your website — see the setup guide.)</p>
                    </details>
                </div>
                <!-- The floor under the monthly offer — the ladder is rendered by
                     renderInstalFloor/apFloorLadderHtml (admin.js). -->
                <div class="accounts-stat" style="max-width:640px;margin-top:14px;">
                    <div class="label">Monthly payments</div>
                    <p style="font-size:0.85rem;color:var(--text-muted);margin:8px 0 10px;">Guests paying a deposit can be offered the rest in monthly instalments. Plans already shrink as the stay approaches — each payment needs a month of room. This sets your floor beneath that; a plan a guest has already agreed keeps running whatever you choose.</p>
                    <label class="modal-label" for="instal-floor">Only offer monthly payments when the balance is due…</label>
                    <select id="instal-floor" class="input-glass" style="max-width:340px;" data-act-change="instalFloorPreview">
                        <option value="">Whenever a plan fits — no minimum</option>
                        <option value="2">At least 2 months away</option>
                        <option value="3">At least 3 months away</option>
                        <option value="4">At least 4 months away</option>
                    </select>
                    <div style="margin-top:10px;">
                        <button class="btn-sm btn-edit" data-act="saveInstalFloor">Save</button>
                    </div>
                    <div id="instal-ladder" style="margin-top:14px;"></div>
                </div>
                <!-- WHICH SQUARE LOCATION THIS SITE IS. Square scopes payouts and bank
                     accounts per location and silently answers for the seller's MAIN one
                     when you don't say, so a seller with more than one gets a confident,
                     complete-looking answer about the wrong shop. Only rendered when
                     there IS a choice to make. -->
                <div class="accounts-stat" style="max-width:640px;margin-top:14px;" id="sq-loc-card" hidden>
                    <div class="label">Which Square location is this site?</div>
                    <p style="font-size:0.85rem;color:var(--text-muted);margin:8px 0 10px;">Your Square account has more than one location. The money screens read payouts and bank accounts for the one you pick here — leave it unset and Square answers for your main location, which may not be this business.</p>
                    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                        <label for="sq-location" class="sr-only">Square location</label>
                        <select id="sq-location" class="input-glass field-sm" style="margin:0;min-width:200px;"></select>
                        <button class="btn-sm btn-edit" data-act="saveSquareLocation">Save</button>
                    </div>
                    <p id="sq-loc-msg" style="font-size:0.82rem;color:var(--text-muted);margin:10px 0 0;"></p>
                </div>
                <div class="accounts-stat" style="max-width:640px;margin-top:14px;">
                    <div class="label">Bank transfer details</div>
                    <p style="font-size:0.85rem;color:var(--text-muted);margin:8px 0 12px;">Used when you chase a guest who paid in cash or by transfer — they get these details instead of a card link. Guests who paid by card carry on getting the card link.</p>
                    <label class="modal-label" for="bacs-details">Account name, sort code and account number</label>
                    <textarea class="input-glass" id="bacs-details" rows="4" placeholder="Cottage Holidays Blakeney&#10;Sort code: 00-00-00&#10;Account: 12345678"></textarea>
                    <div style="margin-top:10px;">
                        <button class="btn-sm btn-edit" data-act="saveBacsDetails">Save</button>
                    </div>
                    <p id="bacs-details-warn" style="font-size:0.82rem;color:var(--warn-text);margin:12px 0 0;display:none;">Nothing saved yet — until you add these, a cash-paying guest is asked to reply for your bank details.</p>
                </div>
                <div class="accounts-stat" id="sq-webhook-card" style="max-width:640px;margin-top:14px;">
                    <div class="label">Automatic payment updates</div>
                    <p id="sq-webhook-status" aria-live="polite" style="font-size:0.9rem;margin:8px 0 4px;">Checking…</p>
                    <div style="margin-top:12px;">
                        <button class="btn-sm btn-edit" id="sq-webhook-connect" data-act="connectSquareWebhook" data-pass="self" style="display:none;">Connect</button>
                    </div>
                    <details class="help-disclosure">
                        <summary>What this does</summary>
                        <p style="font-size:0.82rem;color:var(--text-light);margin-top:8px;line-height:1.6;">When connected, Square tells your site the moment a payment settles or a refund completes — so card <strong>fees</strong>, the <strong>net payout</strong> and <strong>refund statuses</strong> fill in automatically, instead of only when you open Payments. One tap sets it up; there's nothing to paste.</p>
                    </details>
                </div>
            </div>

            <!-- Guest accounts -->
            <div class="settings-sec" id="sec-guests" style="display:none;">
                <!-- The guest table is wide (5 columns + actions): give the card room on
                     desktop and let the table SCROLL inside it (overflow-x) — it used to
                     spill past the card's 640px edge. -->
                <div class="accounts-stat" style="max-width:960px;">
                    <div class="label">Reset a guest's password</div>
                    <p style="font-size:0.85rem;color:var(--text-muted);margin:6px 0 16px;">If a guest is locked out, set a new password for them here, then tell them the new password so they can log in and change it.</p>
                    <div id="guest-admin-list" style="margin-top:4px;overflow-x:auto;"><p style="font-size:0.82rem;color:var(--text-muted);">Loading…</p></div>
                </div>
            </div>

        </div>
    </template>

<template data-view="view-search" data-host="body">
    <div id="cmdk" class="cmdk-page" role="search" aria-label="Search the back office">
        <div class="cmdk-box">
            <div class="cmdk-search">
                <!-- The AI status lives IN the logo: this knot is #cmdk-ml — its COLOUR
                     names the model state (purple ready · green understood · Siri-teal
                     meaning · rose guess · orange learning · progress ring while a
                     model downloads); the hover title explains it in words. Always
                     visible — the ✕ clear sits on the right, after the input. -->
                <span id="cmdk-ml" class="cmdk-logo" data-mstate="" aria-live="polite" title="What the assistant is doing"><svg class="ic cmdk-search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12L20.8 13L20.1 13.9L19.2 14.5L18.1 14.9L17 15.2L16.1 15.2L15.3 15.3L14.8 15.6L14.5 16L14.3 16.7L14 17.6L13.5 18.6L12.9 19.6L12 20.3L11 20.8L10 20.8L9.1 20.3L8.4 19.5L7.9 18.5L7.8 17.3L7.8 16.2L7.9 15.2L8 14.5L7.9 14L7.5 13.6L6.9 13.2L6.1 12.7L5.2 12L4.4 11.1L3.9 10.1L3.7 9.1L3.9 8.1L4.5 7.3L5.5 6.8L6.6 6.6L7.8 6.7L8.8 7L9.7 7.3L10.4 7.5L11 7.6L11.5 7.3L12 6.8L12.7 6.1L13.5 5.4L14.5 4.8L15.6 4.5L16.7 4.5L17.6 5L18.2 5.8L18.5 6.8L18.5 7.9L18.1 9.1L17.6 10L17.1 10.8L16.7 11.5L16.5 12L16.7 12.5L17.1 13.2L17.6 14L18.1 14.9L18.5 16.1L18.5 17.2L18.2 18.2L17.6 19L16.7 19.5L15.6 19.5L14.5 19.2L13.5 18.6L12.7 17.9L12 17.2L11.5 16.7L11 16.4L10.4 16.5L9.7 16.7L8.8 17L7.8 17.3L6.6 17.4L5.5 17.2L4.5 16.7L3.9 15.9L3.7 14.9L3.9 13.9L4.4 12.9L5.2 12L6.1 11.3L6.9 10.8L7.5 10.4L7.9 10L8 9.5L7.9 8.8L7.8 7.8L7.8 6.7L7.9 5.5L8.4 4.5L9.1 3.7L10 3.2L11 3.2L12 3.7L12.9 4.4L13.5 5.4L14 6.4L14.3 7.3L14.5 8L14.8 8.4L15.3 8.7L16.1 8.8L17 8.8L18.1 9.1L19.2 9.5L20.1 10.1L20.8 11Z"/></svg></span>
                <input id="cmdk-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-haspopup="listbox" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search or ask…" data-act-input="cmdkSearch" data-pass="value" data-act-keydown="cmdkKey" aria-label="Search bookings and screens, or ask who owes money, who's leaving today, or what's upcoming" aria-controls="cmdk-results">
                <button type="button" id="cmdk-clear" class="cmdk-clear" data-act="cmdkClear" aria-label="Clear search" title="Clear"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
                <!-- PIN — shown only when the committed query is an ANSWER (the same
                     cmdkIsHeroRow test the thread uses; commands and refinements never
                     offer it). A pin stores the QUERY; the landing recomputes it live,
                     so pinned answers are a dashboard, not a scrapbook. -->
                <button type="button" id="cmdk-pin" class="cmdk-help-btn cmdk-pin-btn" data-act="chbPinToggle" aria-pressed="false" aria-label="Pin this answer to your landing" title="Pin this answer" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5h6l-.7 6.2 3.2 3.3v1.5H6.5V13l3.2-3.3z"/><path d="M12 14.5V21"/></svg></button>
                <!-- CLOSE. Required, not decorative: the window grows to cover the whole
                     screen, so the crown, the scrim and the header are all underneath it
                     and Escape would otherwise be the only way out — which is no way out
                     at all on a phone. Distinct from the ✕ clear (which only empties the
                     query, and only shows when there IS a query). -->
                <button type="button" id="cmdk-close" class="cmdk-close-btn" data-act="cmdkBack" aria-label="Close search" title="Close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
                <button type="button" id="cmdk-help" class="cmdk-help-btn" data-act="cmdkHelpOpen" aria-label="Help for this screen" title="Help &amp; how-to"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.8 2.8 0 0 1 5.4 1c0 1.9-2.8 2.5-2.8 2.5"/><path d="M12 17h.01"/></svg></button>
            </div>
            <div id="cmdk-progress" class="cmdk-progress" aria-hidden="true"><span></span></div>
            <div id="cmdk-results" class="cmdk-results" role="listbox" aria-label="Search results"></div>
            <div class="cmdk-foot">
                <span class="cmdk-foot-keys" aria-hidden="true"><kbd class="cmdk-kbd">↑</kbd><kbd class="cmdk-kbd">↓</kbd> Navigate</span>
                <span class="cmdk-foot-keys" aria-hidden="true"><kbd class="cmdk-kbd">↵</kbd> Open</span>
                <span class="cmdk-foot-keys" aria-hidden="true"><kbd class="cmdk-kbd">esc</kbd> Back</span>
                <!-- SYSTEM STATE. A command centre says the machine is alive without
                     being asked; these signals otherwise live in Manage → Status,
                     where you only look AFTER something has gone wrong. Filled by
                     chbSysLine() on every open. NB the foot itself can no longer be
                     aria-hidden — the keycaps stay hidden (they are decoration for a
                     touch user) but a warning about a stopped automation must be
                     announced, so it carries its own role=status. -->
                <button type="button" id="cmdk-sys" class="cmdk-sys" role="status" hidden></button>
            </div>
        </div>
    </div>
    </template>
