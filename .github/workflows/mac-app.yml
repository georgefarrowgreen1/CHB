# ============================================================
#  Mac app — builds the Cottage Holidays Blakeney Mac companion into a
#  universal .dmg on a real Mac.
#
#  A .dmg cannot be made anywhere but macOS: the format is produced by `hdiutil`,
#  and a universal binary is merged by `lipo`. Both are Apple's, both are
#  macOS-only, so this is the only honest way to get one out of this repo —
#  GitHub's macos-14 runners are Apple silicon Macs, and on a PUBLIC repo their
#  minutes are free.
#
#  Two ways to start it:
#    * Actions → "Mac app" → Run workflow          (a build you can download)
#    * push a tag matching hand-v*                 (a build AND a release)
#
#  IT SIGNS AND NOTARISES ONLY IF YOU HAVE GIVEN IT THE MEANS TO. With the four
#  Apple secrets set it produces an app that opens with a double-click; without
#  them it produces an unsigned one that needs System Settings → Privacy &
#  Security → Open Anyway on first launch. It never pretends: the release notes
#  say which kind it is.
#
#    MAC_CERT_P12       base64 of your Developer ID Application .p12
#    MAC_CERT_PASSWORD  the password for that .p12
#    APPLE_ID           your Apple ID email
#    APPLE_APP_PASSWORD an app-specific password from appleid.apple.com
#    APPLE_TEAM_ID      your 10-character team id
# ============================================================
name: Mac app

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish a GitHub release (so the site can link to it)'
        type: boolean
        default: false
  push:
    tags: ['hand-v*']

permissions:
  contents: write   # needed to create the release the download link points at

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    # macos-14 is Apple silicon. A universal build needs lipo, which is here and
    # nowhere else — this is the whole reason the job cannot run on ubuntu.
    runs-on: macos-14
    # 45 was enough for the app alone; the llama-server compile adds ~12 min
    # on a cache miss (a fresh llama.cpp release), so the ceiling covers both.
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # THE TAG IS DECIDED BEFORE THE BUILD, not at publish time. The app has to
      # be stamped with the version it will be released AS, or it cannot tell
      # whether it is up to date — and it was decided in the publish step, which
      # runs after packaging. Same value now feeds both.
      - name: Decide the version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="hand-build-$(date -u +%Y%m%d-%H%M)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # AND A BUILD NUMBER FOR THE ABOUT PANEL. macOS reads its version from
          # Info.plist, which took package.json's semver — so About said
          # "Version 1.0.0 (1.0.0)" on every build ever made, while the sidebar
          # said hand-build-20260818-0842. The one place someone looks to answer
          # "which build am I on" was the one place that could not say.
          #
          # Dotted digits, not the tag itself: CFBundleVersion is specified as
          # numbers and periods, and a string with letters and hyphens in it is
          # asking for trouble at notarisation. Same digits as the tag, so the
          # two are recognisably the same build.
          echo "build=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_OUTPUT"
          echo "This build is $TAG"

      - name: Install
        working-directory: mac-app
        run: npm install --no-audit --no-fund

      # Written INTO the bundle (src/ is packaged), so the running app knows its
      # own release tag. Without it appVersion() falls back to package.json's
      # semver and the updater announces a newer version for ever.
      - name: Stamp the release tag into the app
        working-directory: mac-app
        run: |
          set -euo pipefail
          printf '{ "tag": "%s" }\n' "${{ steps.ver.outputs.tag }}" > src/release.json
          cat src/release.json

      # NEVER SHIP A BUILD WHOSE OWN TESTS FAILED. The core suite is the thing
      # that checks the draft guard, and a .dmg that got past a broken guard is
      # worse than no .dmg at all.
      - name: The core suite (the draft guard, the engines, the model library)
        working-directory: mac-app
        run: node test/core-test.js

      # The window, in the runner's own Chromium via playwright. Skips itself if
      # playwright is not installed, so it can never be the reason a build fails
      # for an unrelated reason.
      - name: The window
        working-directory: mac-app
        run: |
          npm install --no-save playwright@1.48.2 >/dev/null 2>&1 || true
          npx playwright install chromium >/dev/null 2>&1 || true
          node test/ui-test.js

      # Comparing the secret in an expression yields a BOOLEAN, so the value
      # itself never reaches a shell — every later step branches on this.
      - name: Is there a signing certificate?
        id: cert
        run: echo "have=${{ secrets.MAC_CERT_P12 != '' }}" >> "$GITHUB_OUTPUT"

      # The standard temporary-keychain dance. It exists only for this job and
      # goes with the runner; nothing is written anywhere that outlives it.
      - name: Import the certificate
        if: steps.cert.outputs.have == 'true'
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # ── THE MODEL SERVER RIDES INSIDE THE APP ─────────────────────────────
      # llama-server is what the app starts for a run (src/core/runner.js), and
      # bundling it is what removes `brew install llama.cpp` — the step that
      # quietly required Homebrew, Xcode command-line tools and a Terminal from
      # someone who was promised a drag-across install.
      #
      # Built from llama.cpp's LATEST RELEASE, resolved here on the runner: a
      # release is only tagged from a build their own CI passed, so it is
      # pinned-to-good without going stale the way a hardcoded tag would.
      # LLAMA_TAG below overrides it when a specific version is wanted.
      #
      # TWO SINGLE-ARCH BUILDS, THEN lipo — deliberately NOT one universal
      # cmake pass, because per-arch is the shape llama.cpp's own release CI
      # proves every day and the fat build is not: arm64 gets Metal with the
      # shaders EMBEDDED (one file, nothing beside it), x86_64 gets AVX2 CPU
      # (ggml's Metal backend is Apple-silicon-only, so an Intel Mac is CPU
      # either way — which is exactly what the app's Runner screen already
      # says). Static, no libcurl: ONE self-contained file, which is the shape
      # runnerCandidates() expects at Resources/runner/llama-server.
      - name: Which llama.cpp
        id: llver
        env:
          GH_TOKEN: ${{ github.token }}
          LLAMA_TAG: ''
        run: |
          set -euo pipefail
          TAG="${LLAMA_TAG:-$(gh api repos/ggml-org/llama.cpp/releases/latest --jq .tag_name)}"
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Bundling llama-server $TAG"

      # ~12 minutes of compiling, so the finished universal binary is cached by
      # the llama.cpp tag: a rebuild of THIS app reuses it, and a new llama.cpp
      # release naturally misses and rebuilds.
      # RESTORE and SAVE separately, because actions/cache only writes its
      # cache when the JOB succeeds — and this compile is followed by packaging,
      # which failed twice. Each failure therefore threw away a perfectly good
      # binary and paid the ~7 minutes again on the next attempt. Exactly the
      # loop the webkit job had in ci.yml, met a second time in the same day.
      - name: A llama-server we built before?
        id: llcache
        uses: actions/cache/restore@v4
        with:
          # The binary AND its licence — llama.cpp is MIT, so the notice ships
          # beside the copy of it we distribute, cache hit or miss alike.
          path: |
            mac-app/build/runner/llama-server
            mac-app/build/runner/LICENSE-llama.cpp.txt
          key: llama-server-universal-${{ steps.llver.outputs.tag }}

      - name: Build llama-server (universal)
        if: steps.llcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.llver.outputs.tag }}"
          curl -sSL "https://github.com/ggml-org/llama.cpp/archive/refs/tags/$TAG.tar.gz" -o /tmp/llama.tgz
          mkdir -p /tmp/llama && tar -xzf /tmp/llama.tgz -C /tmp/llama --strip-components 1
          cd /tmp/llama
          # NO TLS IN THE SERVER, and this is what the first build tripped on.
          #
          # vendor/cpp-httplib/CMakeLists.txt does `elseif (LLAMA_OPENSSL)` →
          # `find_package(OpenSSL)`, and LLAMA_OPENSSL defaults ON. CMake's find
          # does not care what ARCHITECTURE the library is, so on this arm64
          # runner it happily found Homebrew's arm64 OpenSSL for the x86_64
          # pass too: the arm64 slice linked and the x86_64 one died with a wall
          # of undefined X509_* symbols "for architecture x86_64".
          #
          # LLAMA_OPENSSL=OFF is the option's own name, read out of that file
          # rather than guessed — an earlier attempt here set LLAMA_SERVER_SSL,
          # which exists nowhere and was silently ignored. The
          # CMAKE_DISABLE_FIND_PACKAGE belt stays because it is CMake's own and
          # survives the option being renamed again; it is SAFE to pair with it
          # only because that find_package is not REQUIRED, so a failed find
          # skips the block rather than failing the configure. Checked.
          #
          # It costs nothing: this server listens on 127.0.0.1 for one local
          # app, so https to it would be ceremony.
          COMMON="-DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_OPENSSL=OFF -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
            -DGGML_NATIVE=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          cmake -B b-arm64 $COMMON -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON
          cmake --build b-arm64 --target llama-server -j "$(sysctl -n hw.ncpu)"
          cmake -B b-x64 $COMMON -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DGGML_METAL=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          cmake --build b-x64 --target llama-server -j "$(sysctl -n hw.ncpu)"
          # NAME THE SLICE THAT IS MISSING. lipo's own error for an absent
          # input is about a file path, which reads as a build-script bug
          # rather than as "the x86_64 compile failed".
          for a in arm64 x64; do
            test -f "b-$a/bin/llama-server" || { echo "::error::the $a slice did not build"; exit 1; }
          done
          mkdir -p "$GITHUB_WORKSPACE/mac-app/build/runner"
          lipo -create b-arm64/bin/llama-server b-x64/bin/llama-server \
            -output "$GITHUB_WORKSPACE/mac-app/build/runner/llama-server"
          cp LICENSE "$GITHUB_WORKSPACE/mac-app/build/runner/LICENSE-llama.cpp.txt"

      # Saved as soon as it exists, not at the end of the job. `if: always()`
      # so a later failure cannot cost the compile a second time.
      - name: Keep it for next time
        if: always() && steps.llcache.outputs.cache-hit != 'true' && hashFiles('mac-app/build/runner/llama-server') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            mac-app/build/runner/llama-server
            mac-app/build/runner/LICENSE-llama.cpp.txt
          key: llama-server-universal-${{ steps.llver.outputs.tag }}

      # PROVED, NOT TRUSTED — this cannot be tested from the repo's Linux CI,
      # so the build that makes it is the gate: both architectures really in
      # the file, and the arm64 slice actually launches on this runner.
      - name: The bundled runner is real
        working-directory: mac-app
        run: |
          set -euo pipefail
          chmod 755 build/runner/llama-server
          ARCHS="$(lipo -archs build/runner/llama-server)"
          echo "archs: $ARCHS"
          case "$ARCHS" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "not universal"; exit 1;; esac
          ./build/runner/llama-server --version
          test -s build/runner/LICENSE-llama.cpp.txt
          du -h build/runner/llama-server

      # NB when a certificate is present, electron-builder signs every Mach-O
      # it finds in the bundle — the extraResources runner included — so the
      # signed/notarised path needs nothing extra here.
      - name: Build the universal .dmg
        working-directory: mac-app
        env:
          # With no certificate, tell electron-builder not to go looking for one:
          # left to itself it picks up whatever identity it finds and fails half
          # way through, which reads as a broken build rather than an unsigned one.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.cert.outputs.have == 'true' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ steps.cert.outputs.have }}" = "true" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "Signing and notarising."
            EXTRA="-c.mac.notarize=true"
          elif [ "${{ steps.cert.outputs.have }}" = "true" ]; then
            echo "Signing, but NOT notarising (no Apple ID / team id set)."
          else
            echo "Unsigned build — it will need Open Anyway on first launch."
          fi
          npx electron-builder --mac --universal $EXTRA -c.buildVersion="${{ steps.ver.outputs.build }}"
          ls -lh dist/*.dmg

      # ── PROVE THE BUILT APP BOOTS. ─────────────────────────────────────────
      # The suites test the JavaScript; nothing had ever LAUNCHED the artifact,
      # which is how a build could pass every gate and die at ElectronMain on
      # the owner's Mac. One leg: native arm64 (this runner). Alive after 15
      # seconds = booted; anything else fails the build before a release
      # exists, printing the app's own output and the .ips crash report.
      #
      # EVERYTHING IN HERE IS BOUNDED, learned three hangs deep:
      #  1. `softwareupdate --install-rosetta` sat in uninterruptible sleep
      #     (29 min unbounded; then shrugged off SIGTERM, so even a bounded
      #     watch blocked at `wait`) — the x86_64 leg is REMOVED. The lipo
      #     step proves the slice exists, and the crash this gate exists for
      #     (the CFBundleName/helper mismatch) is architecture-independent.
      #  2. A bare `wait` after `kill` blocked 23 min when the booted app
      #     survived SIGTERM — ending the app is now TERM → grace → KILL,
      #     never a wait, plus a pkill sweep of any orphaned helper (an
      #     orphan holding a runner pipe keeps the step alive after bash
      #     exits, which is also why the launch takes stdin from /dev/null).
      #  3. timeout-minutes is the outer wall GitHub enforces from outside
      #     the shell, so no future variant of this can eat the job either.
      - name: Prove the built app boots (arm64, native)
        timeout-minutes: 4
        working-directory: mac-app
        run: |
          set -uo pipefail
          APP="$(ls -d dist/mac-universal/*.app | head -1)"
          EXE="$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          BIN="$APP/Contents/MacOS/$EXE"
          echo "── arm64, native ──"
          date > /tmp/boot-marker
          ELECTRON_ENABLE_LOGGING=1 "$BIN" --enable-logging < /dev/null > /tmp/boot-log.txt 2>&1 &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "alive after 15s ✓"
            kill "$pid" 2>/dev/null || true
            for i in 1 2 3 4 5; do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            kill -9 "$pid" 2>/dev/null || true
            pkill -9 -f "$EXE" 2>/dev/null || true
            echo "── first lines of the boot log ──"
            head -8 /tmp/boot-log.txt || true
            echo "x86_64 slice presence is proven by the lipo step above; a runtime x86_64 boot is not attempted (Rosetta on hosted runners hangs — see this step's history)."
            exit 0
          fi
          # NB the job shell runs with -e, so `wait` must not be allowed to
          # abort the script before the diagnosis prints — the first version
          # died at this line and the evidence below never appeared. (This
          # wait is on a child already seen dead, so it only reaps.)
          code=0
          wait "$pid" || code=$?
          echo "DIED (exit $code) — the app's own output:"
          cat /tmp/boot-log.txt || true
          echo "── the runner's crash report, if macOS wrote one ──"
          sleep 8
          REP="$(find "$HOME/Library/Logs/DiagnosticReports" -name '*.ips' -newer /tmp/boot-marker 2>/dev/null | head -1)"
          if [ -n "$REP" ]; then
            head -c 6000 "$REP"; echo
          else
            echo "(none found)"
          fi
          exit 1

      - name: What was built
        id: out
        working-directory: mac-app
        run: |
          set -euo pipefail
          DMG="$(ls dist/*.dmg | head -1)"
          # ABSOLUTE, because the publish step below does NOT run in mac-app —
          # a path relative to this step's working-directory resolves to nothing
          # there, which is exactly how the first real run failed after a
          # perfectly good build.
          echo "dmg=$PWD/$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$DMG" | cut -f1)" >> "$GITHUB_OUTPUT"
          # A universal build carries both architectures. Worth PROVING rather
          # than trusting the flag: lipo lists what is actually inside.
          APP="$(ls -d dist/mac-universal/*.app 2>/dev/null | head -1 || true)"
          if [ -n "$APP" ]; then
            lipo -archs "$APP/Contents/MacOS/Cottage Holidays Blakeney AI" || true
          fi

      # Always keep the file, even on a plain dispatch with no release: a build
      # you cannot download is not a build.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: mac-app/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

      # A RELEASE is what the site's download link can point at. Only on a tag,
      # or when the dispatch explicitly asks — a release is public and permanent,
      # so it is never a side effect of pressing Run.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/hand-v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The SAME tag the app was stamped with above — deriving it twice is
          # how the bundle ends up claiming a version the release does not have.
          TAG="${{ steps.ver.outputs.tag }}"
          TARGET=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Let `gh release create` mint the tag from --target, rather than
            # pushing one first: a tag pushed before a release that then fails
            # is an orphan nobody will ever tidy up.
            TARGET="--target $GITHUB_SHA"
          fi
          SIGNED="unsigned — on first launch open System Settings → Privacy & Security and press Open Anyway"
          if [ "${{ steps.cert.outputs.have }}" = "true" ]; then SIGNED="signed, so it opens with a double-click"; fi
          {
            echo "Cottage Holidays Blakeney AI for macOS — one universal build for Intel and Apple silicon."
            echo
            echo "This copy is **$SIGNED**."
            echo
            echo "Paste this file's download link into Manage → System check → The Mac app,"
            echo "and the back office gets a one-tap download."
            echo
            echo "It needs a model runner on the Mac (llama.cpp or Ollama) and the overnight"
            echo "queue switched on. mac-app/README.md covers both."
          } > notes.md
          gh release create "$TAG" "${{ steps.out.outputs.dmg }}" $TARGET \
            --title "Cottage Holidays Blakeney AI ${TAG}" --notes-file notes.md
          echo "This build:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${{ steps.out.outputs.name }}"
          echo "The link the site uses, which always points at the newest release:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${{ steps.out.outputs.name }}"
