name: CI

# Tiny safety net: lint every PHP file and run the front-end smoke test on each
# pull request (and on pushes to main) so a broken edit can't reach production.

on:
  push:
    branches: [ main ]
  pull_request: {}

# One live run per PR: a new push cancels the previous (possibly hung) run
# instead of queueing behind it. Pushes to main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # check-versions.js diffs against the PR base commit.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PIN PHP: ubuntu-latest's default PHP jumps whenever GitHub rolls the
      # runner image — tests would silently start running on a version the
      # IONOS host doesn't. Keep this pinned to the host's PHP major.minor
      # (check Manage → System diagnostics) and bump both together.
      - name: Set up PHP 8.3 (pinned to the production host)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, mysqli, gd, curl
          coverage: none

      - name: PHP syntax check (php -l on every .php)
        run: |
          set -e
          find "Cottage Holidays Blakeney" -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      # typescript is installed HERE, before the smoke test, not two hundred
      # lines down with the type-check ratchet. smoke-test §12g verifies the
      # deploy-time comment strip by comparing TOKEN STREAMS, and with no
      # typescript to parse with it cannot — so the check failed in CI while
      # passing locally, where typescript happens to be installed. A gate that
      # can only run on a developer's machine is the vacuity trap this file
      # warns about everywhere else. The later steps reuse this install.
      - name: Cache npm (eslint + typescript)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-eslint-${{ runner.os }}-v1

      - name: Install the JS toolchain (eslint, typescript)
        working-directory: "Cottage Holidays Blakeney"
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-audit --no-fund --prefer-offline eslint globals typescript@5.6.3

      - name: Front-end smoke test
        working-directory: "Cottage Holidays Blakeney"
        run: node smoke-test.js

      # Performance budget: the gzipped transfer size of every shipped asset
      # must stay within size-budget.json — byte growth becomes a conscious,
      # reviewed decision (bump the budget in the same PR and say what the
      # bytes buy) instead of silent rot.
      - name: Performance budget (gzipped asset sizes vs size-budget.json)
        working-directory: "Cottage Holidays Blakeney"
        run: node perf-budget.js

      # The two CSS conventions in CLAUDE.md — the four canonical breakpoints and
      # "no raw hex where a token covers it" — were documented but ungated, so both
      # had drifted. Same ratchet contract as the budgets above: the counts in
      # css-budget.json may only fall.
      - name: CSS convention ratchet (breakpoints + raw hex vs css-budget.json)
        working-directory: "Cottage Holidays Blakeney"
        run: node check-css-conventions.js

      # The basemap: one definition, a tile host the CSP actually permits, and a
      # zoom the provider actually serves. Every way a map breaks is SILENT — a
      # blocked host paints an empty box, a zoom past the ceiling answers 400 per
      # tile, and CARTO's unkeyed watermark arrived with a 200 — so none of it is
      # reachable by watching for errors.
      - name: Basemap tiles (one definition, CSP-permitted host, served zoom)
        working-directory: "Cottage Holidays Blakeney"
        run: node test-maptiles.js

      # The GIT half of the deploy checklist: if a PR changes a cached asset,
      # its cache-buster (?v= / BUILD / ADMIN_*_V / CACHE) must change too.
      # `node bump.js <stamp>` applies the whole chain in one go. (smoke-test
      # guards the static half — sw.js CORE ?v= == index.html ?v=.)
      - name: Version-chain consistency (changed asset → bumped version)
        working-directory: "Cottage Holidays Blakeney"
        env:
          CHB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node check-versions.js

      - name: Search registry completeness
        working-directory: "Cottage Holidays Blakeney"
        run: node search-test.js

      # The answer-shape contract: ~100 real phrasings → expected answers over a
      # seeded booking set. Catches the "right machinery, wrong answer" class of
      # regression (e.g. a phrasing answering with the wrong date window).
      - name: Search golden-query corpus
        working-directory: "Cottage Holidays Blakeney"
        run: node golden-test.js

      - name: Pricing parity (PHP price_breakdown vs JS fixtures)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-pricing.php

      - name: Reply-by-email logic (tokens + quote stripping)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-reply.php

      - name: Customer directory grouping (strong-identity unify + false-merge guard)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-customers.php

      - name: Guest FAQ-miss capture (dedupe + count + cap aggregation)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-guestfaq.php

      - name: Watcher rules (identity, cap, due/expiry, and when they must stay silent)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-watchers.php

      - name: Weather judgement (plain-English codes + only-interrupt-when-it-matters)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-weather.php

      - name: Key safe keeper (bad codes, generation, sanitiser, the reveal window)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-keysafe.php

      - name: Overnight queue (what a machine may put on the owner's screen, and the deadline)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-nightshift.php

      # The Mac app that FEEDS the overnight queue. No dependencies at all — the
      # whole core is plain Node — so this costs nothing and covers the part of
      # that app where being wrong would be invisible: the draft guard.
      - name: Mac app core (the draft guard, the engines, the model library)
        working-directory: mac-app
        run: node test/core-test.js

      - name: SMS settings (config const still wins, the auth token never leaves the server)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-sms.php

      - name: Payment rail (card payers keep the card link, cash payers get BACS)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-payrail.php

      - name: Email templates (all 21 render; every colour clears WCAG AA)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-emails-render.php

      - name: The guest invoice — deposit states, money, contrast, affordances
        working-directory: "Cottage Holidays Blakeney"
        run: php test-invoice.php

      - name: Square webhook signature verification
        working-directory: "Cottage Holidays Blakeney"
        run: php test-webhook.php

      - name: CSP-report severity gate
        working-directory: "Cottage Holidays Blakeney"
        run: php test-csp-report.php

      - name: Weekly backup encryption (opens with the real openssl binary)
        working-directory: Cottage Holidays Blakeney
        run: php test-backup-crypt.php

      - name: Web Push payload encryption (RFC 8291)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-webpush.php

      - name: Safe-to-move arithmetic (deposit clawback vs bank balance)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-sweep.php

      - name: Payout landing decisions (in the bank vs on its way)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-payouts.php

      - name: Automatic balance collection (consent, retries, silences)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-autopay.php

      - name: Orphan sweep — money taken at Square with no record here
        working-directory: "Cottage Holidays Blakeney"
        run: php test-orphans.php

      - name: Bank accounts — is there anywhere for the money to go
        working-directory: "Cottage Holidays Blakeney"
        run: php test-bank.php

      - name: Calendar sync — a bad feed must never empty the calendar
        working-directory: "Cottage Holidays Blakeney"
        run: php test-ical.php

      - name: Waitlist — who gets told a space opened, and who must NOT
        working-directory: "Cottage Holidays Blakeney"
        run: php test-waitlist.php

      - name: Request firewall (htaccess injection filter — no false positives, real coverage)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-waf.php

      # Locked-price emails: booking_price() → build_enquiry_reply_email() must
      # quote the AGREED snapshot for confirmed bookings, live rates only as the
      # legacy fallback — the guest-facing half of test-pricing.php's guard.
      - name: Locked-price email rendering
        working-directory: "Cottage Holidays Blakeney"
        run: php test-emails.php

      # Guest-registration form (UK hotel-records duty): validation + rendering
      # of the token-linked party form (guest-details.php pure functions).
      - name: Guest-registration form logic
        working-directory: "Cottage Holidays Blakeney"
        run: php test-guestreg.php

      # Auth posture: every web-reachable .php declares its guard (admin /
      # guest / cron / token / webhook / rate-limited / public-with-reason /
      # lib / dev) and the gate verifies the guard call is actually present —
      # a new endpoint with no auth line, or an edit that strips one, fails.
      - name: Endpoint auth-posture gate
        working-directory: "Cottage Holidays Blakeney"
        run: php test-auth-posture.php

      - name: Error-status gate (a failure must not answer with a 2xx)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-error-status.php

      # Content-key classification: every content-table key written by server
      # code must be classified internal/private (db.php) or explicitly public,
      # or the public content GET serves it to anonymous visitors (the
      # owner-ping leak class).
      - name: Content-key classification gate
        working-directory: "Cottage Holidays Blakeney"
        run: php test-content-keys.php

      # SQL statement splitter: a semicolon inside an inline comment must not
      # chop a migration in half (regression for the broken guest-registrations
      # migration — MySQL 1064 "near '' at line 8").
      - name: Migration SQL splitter
        working-directory: "Cottage Holidays Blakeney"
        run: php test-migrate.php

      # A gate that stubs one of the app's helpers with a NARROWER signature turns
      # every real call site into a PHPStan arguments.count error, while every test
      # and browser suite stays green — measured, 95 failures from one 0-arg stub,
      # the third time that file had done it. PHPStan is the only other gate that
      # sees it and it has no local runner, so this one makes it fail before a push.
      - name: Test-stub arity (a stub must mirror the signature it shadows)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-stub-arity.php

      # SMTP transport: runs mailer.php's real socket conversation against a
      # scriptable fake SMTP server — happy path, transient-retry, the
      # no-retry-after-payload guarantee (double-send safety), batch-over-one-
      # connection, mid-batch recipient rejection, and preview capture.
      - name: SMTP transport tests (fake server)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-smtp.php

      # Static "undefined reference" gate for the front-end JS — catches typo'd /
      # missing functions and variables (the "X is not defined" runtime errors)
      # before they ship, which php -l's JS equivalent (node --check) can't see.
      - name: JS static check (ESLint no-undef)
        working-directory: "Cottage Holidays Blakeney"
        run: node lint-js.js

      # Type-error RATCHET: tsc --checkJs as a linter (no build step, no runtime
      # change). Error counts per group must stay ≤ the committed budgets in
      # tsc-budget.json — the long tail of legacy "window.*" errors only ever
      # shrinks. Pinned typescript (counts differ across compiler versions).
      - name: JS type-check ratchet (tsc --checkJs vs tsc-budget.json)
        working-directory: "Cottage Holidays Blakeney"
        run: node typecheck.js

      # PHP static analysis — catches undefined functions/constants/variables and
      # wrong argument counts across every endpoint, far beyond php -l's syntax
      # check. A committed phpstan-baseline.neon (if present) scopes it to NEW code.
      # The phar is cached (it never changes for a pinned version) and so is
      # PHPStan's RESULT cache — unchanged files aren't re-analysed, which cuts
      # the analyse step from ~20s to a few seconds on typical PRs.
      - name: Cache PHPStan (phar + result cache)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/phpstan.phar
            Cottage Holidays Blakeney/.phpstan-cache
          key: phpstan-2.2.5-${{ hashFiles('Cottage Holidays Blakeney/**/*.php') }}
          restore-keys: |
            phpstan-2.2.5-

      - name: PHP static analysis (PHPStan)
        working-directory: "Cottage Holidays Blakeney"
        run: |
          [ -s /tmp/phpstan.phar ] || curl -sSL https://github.com/phpstan/phpstan/releases/download/2.2.5/phpstan.phar -o /tmp/phpstan.phar
          php /tmp/phpstan.phar analyse -c phpstan.neon.dist --no-progress --error-format=table

  # The one suite that exercises the REAL stack: a fresh MySQL database,
  # schema.sql + every migration applied by migrate.php over HTTP, then the
  # actual JSON endpoints (admin session + CSRF, cottage creation, a public
  # enquiry approved into a booking with a locked price snapshot, a recorded
  # payment) served by php -S. Catches migration-ordering/SQL bugs that only
  # appear on a fresh database and endpoint auth/money regressions that
  # pure-function tests can't see. Uses the runner's preinstalled MySQL.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Same PHP pin as the checks job (see the comment there).
      - name: Set up PHP 8.3 (pinned to the production host)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, mysqli, gd, curl
          coverage: none

      - name: Start MySQL (preinstalled on the runner)
        run: |
          sudo systemctl start mysql
          mysql -h 127.0.0.1 -u root -proot -e "SELECT VERSION();"

      - name: Real-stack integration test (fresh DB → migrate → live endpoints)
        working-directory: "Cottage Holidays Blakeney"
        run: php test-integration.php

  # Real-browser tests, split into PARALLEL jobs so the wall-clock is the
  # slowest single job rather than the sum. Plain ubuntu-latest runners (the
  # Playwright container image hung on this repo's runners) with the browser
  # binaries cached between runs — the install step is a cache hit except when
  # the pinned Playwright version changes.
  browser-core:
    runs-on: ubuntu-latest
    # 15 was the original ceiling and this job has outgrown it: measured at
    # 780s (13.0 min) on a green run, i.e. two minutes of headroom. The layout
    # job hit exactly this wall — see the note there — so the budget is raised
    # here BEFORE it starts failing rather than after.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only the browser/layout suites care about rendered output — skip the
      # (slow) browser install + tests when a PR touches nothing that renders.
      # The job still runs and reports SUCCESS so it stays a satisfied required
      # check. Fail-safe: if the diff can't be computed, we run everything.
      - name: Detect frontend changes
        id: fe
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }} ${{ github.sha }}"
          fi
          CHANGED=$(git diff --name-only $RANGE 2>/dev/null || echo __DIFF_FAILED__)
          if [ "$CHANGED" = "__DIFF_FAILED__" ] || echo "$CHANGED" | grep -qE 'index\.html|app\.(css|js)|admin\.(js|css)|guest-app\.(js|css)|home\.php|cottage\.php|experiences-page\.php|e2e-test\.js|ui-tests?\.js|ui-test-.*\.js|layout-test\.js|mac-app/|\.github/workflows/ci\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Frontend touched → running browser tests."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No frontend changes → skipping browser tests (fast green)."
          fi

      - name: Set up Node
        if: steps.fe.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        if: steps.fe.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.61.1
          restore-keys: |
            playwright-${{ runner.os }}-chromium-

      - name: Install Playwright (Chromium)
        if: steps.fe.outputs.run == 'true'
        timeout-minutes: 15
        working-directory: "Cottage Holidays Blakeney"
        run: |
          # The hosted runner's Microsoft/Azure apt repos intermittently serve an
          # unsigned InRelease ("NOSPLIT"), which fails `--with-deps`' apt-get and
          # kills the whole browser-test. We don't need those repos, so drop them
          # before the install.
          sudo rm -f /etc/apt/sources.list.d/*microsoft*.list /etc/apt/sources.list.d/*azure*.list 2>/dev/null || true
          # ── THE APT MIRROR IS THE FLAKE, AND THIS IS THE MEASURED FIX ──
          # The `rm -f *azure*.list` below removes Azure's PACKAGE FEED and
          # reads as if it dealt with Azure — it does not. The hosted runner
          # resolves the Ubuntu ARCHIVE through `mirror+file:/etc/apt/apt-
          # mirrors.txt`, whose priority:1 entry is azure.archive.ubuntu.com,
          # and THAT is what stalls. Measured in the log of a timed-out webkit
          # leg: 181 packages / 114 MB requested, of which FIVE arrived in 18
          # minutes — fonts-freefont-ttf (5.6 MB) took 6m10s and
          # fonts-tlwg-loma-otf, all 107 KB of it, took 8m51s. A 107 KB file
          # taking nine minutes is a dead connection, not a slow one.
          #
          # Three lines, each doing a different job:
          #  1. drop to archive.ubuntu.com, which is the mirrorlist's own
          #     priority:2 fallback — apt never reaches it by itself, because
          #     a stalled transfer is not an error it fails over from;
          #  2. give apt a timeout at all. Its default covers CONNECTING, so a
          #     socket that trickles a few bytes a minute is never abandoned;
          #  3. retry, since one bad connection should not be terminal.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt || true
          fi
          printf 'Acquire::http::Timeout "25";\nAcquire::https::Timeout "25";\nAcquire::Retries "3";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-chb-apt-timeouts > /dev/null
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.61.1
          # SPLIT, not `--with-deps`: the apt half runs every time (system
          # packages are not what actions/cache holds) while the download half
          # is skipped entirely on a cache hit. As one opaque step there was no
          # way to tell which half was slow — see the layout job.
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Browser smoke test
        if: steps.fe.outputs.run == 'true'
        working-directory: "Cottage Holidays Blakeney"
        run: node e2e-test.js

      # Behaviour suites (booking hub, Needs-you, locked price, guest modals,
      # mailbox, Payments, merged workspace) — three suites at a time.
      - name: UI behaviour suites
        if: steps.fe.outputs.run == 'true'
        working-directory: "Cottage Holidays Blakeney"
        run: node ui-tests.js

      # The Mac app's window, driven in a browser against a fake bridge. It
      # skips itself if playwright is absent, so it can never be the reason CI
      # is red for an unrelated reason.
      - name: Mac app window (screens, escaping, the withdrawn engine)
        if: steps.fe.outputs.run == 'true'
        working-directory: mac-app
        run: node test/ui-test.js

      # Accessibility gate: text-token contrast by arithmetic (both themes, every
      # surface), the accent-as-text ratchet, plus accessible names / minimum
      # font size / minimum control size read from a real render. Ratchets against
      # a11y-budget.json — counts may only fall. See the header of a11y-test.js
      # for what it deliberately does NOT try to measure, and why.
      - name: Accessibility gate (contrast tokens, names, target sizes)
        if: steps.fe.outputs.run == 'true'
        working-directory: "Cottage Holidays Blakeney"
        run: node a11y-test.js

  # Design-regression gate: layout invariants (no horizontal overflow, no
  # content cut off, key content rendered) at phone / tablet / desktop widths.
  # Chromium and WebKit run as parallel matrix legs; WebKit is Safari's engine
  # and catches iPhone-only overlaps Chromium can't reproduce.
  layout:
    runs-on: ubuntu-latest
    # THE WEBKIT LEG DIED HERE, TWICE, AND "CANCELLED" IS GITHUB'S WORD FOR
    # TIMED OUT. Measured: the job ran 918s against a 900s ceiling and was
    # killed during `playwright install --with-deps webkit`; the chromium leg
    # finished the whole suite in 197s. WebKit's apt dependency set is far
    # larger than Chromium's and is installed FRESH every run, because the
    # browser cache does not cover system packages.
    #
    # Worse, it was self-perpetuating: actions/cache only SAVES on a successful
    # job, so every timeout guaranteed the next run started cold and timed out
    # again. Raising the ceiling is what breaks that loop — and it costs
    # nothing on a healthy run, where only a struggling leg uses the headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same path filter as browser-core: skip the layout gate on backend-only
      # PRs. Job still reports SUCCESS; fail-safe runs everything if unsure.
      - name: Detect frontend changes
        id: fe
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }} ${{ github.sha }}"
          fi
          CHANGED=$(git diff --name-only $RANGE 2>/dev/null || echo __DIFF_FAILED__)
          if [ "$CHANGED" = "__DIFF_FAILED__" ] || echo "$CHANGED" | grep -qE 'index\.html|app\.(css|js)|admin\.(js|css)|guest-app\.(js|css)|home\.php|cottage\.php|experiences-page\.php|e2e-test\.js|ui-tests?\.js|ui-test-.*\.js|layout-test\.js|mac-app/|\.github/workflows/ci\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Frontend touched → running layout gate."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No frontend changes → skipping layout gate (fast green)."
          fi

      - name: Set up Node
        if: steps.fe.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        if: steps.fe.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-1.61.1
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.engine }}-

      - name: Install Playwright (${{ matrix.engine }})
        if: steps.fe.outputs.run == 'true'
        # A STEP timeout, so a hang is reported as this step timing out rather
        # than as the whole job being "cancelled" — which reads like somebody
        # pressed a button and sent me looking for a person.
        timeout-minutes: 18
        working-directory: "Cottage Holidays Blakeney"
        run: |
          # (Same Microsoft-apt-repo cleanup as browser-core.)
          sudo rm -f /etc/apt/sources.list.d/*microsoft*.list /etc/apt/sources.list.d/*azure*.list 2>/dev/null || true
          # ── THE APT MIRROR IS THE FLAKE, AND THIS IS THE MEASURED FIX ──
          # The `rm -f *azure*.list` below removes Azure's PACKAGE FEED and
          # reads as if it dealt with Azure — it does not. The hosted runner
          # resolves the Ubuntu ARCHIVE through `mirror+file:/etc/apt/apt-
          # mirrors.txt`, whose priority:1 entry is azure.archive.ubuntu.com,
          # and THAT is what stalls. Measured in the log of a timed-out webkit
          # leg: 181 packages / 114 MB requested, of which FIVE arrived in 18
          # minutes — fonts-freefont-ttf (5.6 MB) took 6m10s and
          # fonts-tlwg-loma-otf, all 107 KB of it, took 8m51s. A 107 KB file
          # taking nine minutes is a dead connection, not a slow one.
          #
          # Three lines, each doing a different job:
          #  1. drop to archive.ubuntu.com, which is the mirrorlist's own
          #     priority:2 fallback — apt never reaches it by itself, because
          #     a stalled transfer is not an error it fails over from;
          #  2. give apt a timeout at all. Its default covers CONNECTING, so a
          #     socket that trickles a few bytes a minute is never abandoned;
          #  3. retry, since one bad connection should not be terminal.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt || true
          fi
          printf 'Acquire::http::Timeout "25";\nAcquire::https::Timeout "25";\nAcquire::Retries "3";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-chb-apt-timeouts > /dev/null
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.61.1
          # Split so the two halves are TIMED SEPARATELY. Working out that
          # "cancelled" meant "the apt half of --with-deps ran past the job
          # ceiling" took reading a duration against a timeout; with these
          # apart, the log says which one is slow.
          #
          # BOUNDED AND RETRIED. WebKit's set is 181 packages against
          # Chromium's handful, so it is the leg that meets a bad mirror
          # first — and the retry is worth having even with the mirror
          # swapped, because the second attempt re-resolves the host rather
          # than inheriting the stalled socket. Bounded at 6 minutes, which
          # is comfortably past every healthy run measured (30-401s).
          timeout 360 npx playwright install-deps ${{ matrix.engine }} \
            || { echo "apt was slow — one more go on a fresh connection"; \
                 sudo apt-get update -q || true; \
                 timeout 420 npx playwright install-deps ${{ matrix.engine }}; }
          npx playwright install ${{ matrix.engine }}

      - name: Layout regression gate (${{ matrix.engine }})
        if: steps.fe.outputs.run == 'true'
        working-directory: "Cottage Holidays Blakeney"
        env:
          CHB_ENGINE: ${{ matrix.engine == 'webkit' && 'webkit' || '' }}
        run: node layout-test.js

      # Every view×width screenshot, kept as an artifact so a reviewer can
      # eyeball the design straight from the PR checks page.
      - name: Upload layout screenshots
        if: always() && steps.fe.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: layout-shots-${{ matrix.engine }}
          path: "Cottage Holidays Blakeney/layout-shots/"
          if-no-files-found: ignore
          retention-days: 14
